name: Build Firmware

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 关键权限：打标签 + 创建Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PlatformIO 缓存
      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      # 安装编译工具
      - name: Install PlatformIO
        run: pip install -U platformio

      # 编译固件
      - name: Build firmware
        run: platformio run

      # 上传编译产物
      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/**/*.bin
          if-no-files-found: error

      # ==============================================
      # 核心：main/master 分支 → 自动创建 latest 标签
      # ==============================================
      - name: Generate latest tag for main/master
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          # 获取当前分支名
          BRANCH=${GITHUB_REF#refs/heads/}
          TAG_NAME="$BRANCH-latest"
          # 强制创建/覆盖标签
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -f $TAG_NAME
          git push -f origin $TAG_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==============================================
      # 自动创建 Release（标签 + 分支latest 都支持）
      # ==============================================
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # 自动使用当前标签名（分支→latest标签，手动→v*标签）
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-latest', github.ref_name) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0} 最新开发版', github.ref_name) }}
          # 覆盖已有文件（修复重复上传报错）
          overwrite_files: true
          # 开发版设为预发布
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          # 上传固件
          files: .pio/build/**/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
