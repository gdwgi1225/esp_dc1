name: Build Firmware

on:
  push:
    branches: [ main, master ]  # 推送这两个分支就触发
    tags: [ 'v*' ]             # 保留标签发布功能
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须权限：创建/发布Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: platformio run

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/**/*.bin
          if-no-files-found: error

      # ✅ 核心修改：main/master 分支 或 标签 都自动发布Release
      - name: Create Release
        # 触发条件：push到main/master 或者 打标签
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          # 自动区分：分支发布叫 latest，标签发布叫版本号
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('{0}-latest', github.ref_name) }}
          # 允许覆盖更新（分支推送每次更新最新固件）
          allow_updates: true
          # 分支发布设为预览版，标签发布为正式版
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: .pio/build/**/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
